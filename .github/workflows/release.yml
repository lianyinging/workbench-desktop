# Desktop release builds — macOS (.dmg, arm64 + Intel) and Windows (.msi + NSIS .exe).
# Linux CLI builds are omitted (Opc WorkBench ships Win + Mac installers only).
#
# CI calls the SAME scripts developers run locally (packaging/build_dmg.sh and
# build_windows.ps1); this file only provisions the toolchain (Node, Rust, a Python venv at
# .venv with PyInstaller) and publishes the results.
#
# Triggers:
#   - tag push `v*`  → builds all targets and attaches them to a DRAFT GitHub Release
#                      (review, then publish by hand).
#   - manual run     → builds and uploads workflow artifacts only (no release).
#
# Each installer is uploaded twice: once with its versioned name (archive) and once with a
# stable name (OpcWorkbench-macos-arm64.dmg, …) so the website can link to
#   github.com/<repo>/releases/latest/download/<stable-name>
# and never need updating.
#
# macOS signing + notarization: Tauri's bundler handles both during `tauri build` when the
# APPLE_* env vars are present (import cert → sign app + sidecar with hardened runtime →
# notarize via notarytool → staple). Driven by repo secrets:
#   APPLE_CERTIFICATE            base64 .p12 (Developer ID Application cert + key)
#   APPLE_CERTIFICATE_PASSWORD   the .p12 export password
#   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_API_KEY_CONTENT        base64 App Store Connect API .p8 (notarytool)
#   APPLE_API_KEY                the API key id
#   APPLE_API_ISSUER             the API issuer id
# When the secrets are absent (forks, scratch runs) the build degrades to unsigned —
# installable via `xattr -cr`. Windows remains unsigned (Authenticode is a later step).

name: Release

on:
  push:
    tags: ["v*", "app-v*"]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon
            slug: macos-arm64
          # Intel macOS: macos-13 retired in Dec 2025; macos-15-intel replaced it and is
          # the LAST x86_64 image Actions will offer (available until Aug 2027). Builds
          # natively — the sidecar is a PyInstaller freeze, which cannot cross-compile.
          - os: macos-15-intel
            slug: macos-x64
          - os: windows-latest
            slug: windows
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: surfaces/gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: surfaces/gui/src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up the sidecar venv (.venv)
        # The build scripts expect a venv at .venv with the package + PyInstaller.
        # typer/tzdata are build-time-only (PyInstaller walks mcp.cli, which needs typer;
        # tzdata ships zoneinfo for Windows). aisuite installs like any other dependency
        # (git-pinned in pyproject.toml).
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then VPY=.venv/Scripts/python; else VPY=.venv/bin/python; fi
          "$VPY" -m pip install --upgrade pip
          # openshell: grpcio, without which the macOS sidecar cannot use OpenShell
          # sandboxes (build_dmg.sh refuses to build without it). Not used on Windows.
          if [ "$RUNNER_OS" = "Windows" ]; then EXTRAS=bedrock; else EXTRAS=bedrock,openshell; fi
          # Intel Mac: cryptography ships no wheel for it any more, so pip builds it from
          # source against Homebrew's OpenSSL, linked dynamically. PyInstaller then bundles
          # that libssl AND Python's own older one under the same name, the old one wins,
          # and the program dies on import ("Symbol not found: _SSL_get0_group_name"; the
          # 0.3.0 and 0.3.1 Intel apps shipped this way). Link OpenSSL in statically.
          if [ "$RUNNER_OS" = "macOS" ] && [ "$(uname -m)" = "x86_64" ]; then
            export OPENSSL_STATIC=1 OPENSSL_DIR="$(brew --prefix openssl@3)"
          fi
          "$VPY" -m pip install -e ".[$EXTRAS]" pyinstaller typer tzdata
          "$VPY" -c "import aisuite, coworker"  # fail fast if either import breaks

      - name: npm ci
        working-directory: surfaces/gui
        run: npm ci

      - name: Build .dmg (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Auto-update artifact signing (minisign, separate from Apple signing). Absent →
          # the build script skips updater artifacts with a warning (fork/scratch runs).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Unset empty APPLE_* vars so runs without secrets stay cleanly unsigned
          # (Tauri treats a present-but-empty var as a config error).
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER; do
            [ -n "$(eval echo "\${$v:-}")" ] || unset "$v"
          done
          if [ -n "${APPLE_API_KEY_CONTENT:-}" ]; then
            echo "$APPLE_API_KEY_CONTENT" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          fi
          unset APPLE_API_KEY_CONTENT
          bash packaging/build_dmg.sh

      - name: Build NSIS .exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./packaging/build_windows.ps1

      # Slim release assets only (stable names). No versioned duplicates, MSI, or CLI tarballs.
      #   Win: OpcWorkbench-windows-setup.exe(+.sig)
      #   Mac: OpcWorkbench-<slug>.dmg + .app.tar.gz(+.sig for updater)
      - name: Stage slim release assets
        run: |
          mkdir -p out
          BUNDLE=surfaces/gui/src-tauri/target/release/bundle
          if [ "$RUNNER_OS" = "Windows" ]; then
            EXE=$(ls "$BUNDLE"/nsis/*.exe 2>/dev/null | head -1)
            [ -n "$EXE" ] || { echo "no NSIS exe"; exit 1; }
            cp "$EXE" out/OpcWorkbench-windows-setup.exe
            SIG=$(ls "$BUNDLE"/nsis/*.exe.sig 2>/dev/null | head -1 || true)
            [ -n "$SIG" ] && cp "$SIG" out/OpcWorkbench-windows-setup.exe.sig
          else
            DMG=$(ls "$BUNDLE"/dmg/*.dmg 2>/dev/null | head -1)
            [ -n "$DMG" ] || { echo "no DMG"; exit 1; }
            cp "$DMG" out/OpcWorkbench-${{ matrix.slug }}.dmg
            if [ -f "$BUNDLE/macos/Opc WorkBench.app.tar.gz" ]; then
              cp "$BUNDLE/macos/Opc WorkBench.app.tar.gz" out/OpcWorkbench-${{ matrix.slug }}.app.tar.gz
              [ -f "$BUNDLE/macos/Opc WorkBench.app.tar.gz.sig" ] && \
                cp "$BUNDLE/macos/Opc WorkBench.app.tar.gz.sig" out/OpcWorkbench-${{ matrix.slug }}.app.tar.gz.sig
            fi
          fi
          ls -la out

      # Tag releases: upload straight to the draft GitHub Release so we do NOT
      # depend on Actions artifact storage (quota is shared across the account and
      # was blocking Win/Mac packaging even after cleanup).
      - name: Upload installers to draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: out/*
          fail_on_unmatched_files: true
          generate_release_notes: true

      # Manual workflow_dispatch only: keep short-lived workflow artifacts.
      - name: Upload workflow artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}
          path: out/*
          if-no-files-found: error
          retention-days: 3

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh release download "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*'
          ls -la dist

      - name: Compose the auto-update manifest (latest.json)
        # Clients poll releases/latest/download/latest.json (see tauri.conf.json
        # plugins.updater.endpoints). Optional secret OPC_UPDATE_PUBLIC_BASE rewrites
        # asset urls to Aliyun OSS/CDN; upload the same filenames there after release.
        # Tag must match tauri.conf.json version. Needs .sig from TAURI_SIGNING_PRIVATE_KEY.
        env:
          OPC_UPDATE_PUBLIC_BASE: ${{ secrets.OPC_UPDATE_PUBLIC_BASE }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          CONF_VERSION=$(python3 -c "import json; print(json.load(open('surfaces/gui/src-tauri/tauri.conf.json'))['version'])")
          if [ "${TAG#v}" != "$CONF_VERSION" ]; then
            echo "::error::tag $TAG != tauri.conf.json version $CONF_VERSION — bump the config before tagging"
            exit 1
          fi
          if ls dist/*.sig >/dev/null 2>&1; then
            EXTRA=()
            if [ -n "${OPC_UPDATE_PUBLIC_BASE:-}" ]; then
              EXTRA=(--base-url "$OPC_UPDATE_PUBLIC_BASE")
            fi
            python3 packaging/make_update_manifest.py \
              --version "${TAG#v}" --tag "$TAG" --repo "$GITHUB_REPOSITORY" \
              --dist dist --out dist/latest.json \
              --notes "Opc WorkBench ${TAG#v}" \
              "${EXTRA[@]}"
          else
            echo "::warning::no updater signatures in dist/ — release ships WITHOUT auto-update manifest"
          fi

      - name: Attach latest.json to draft release
        if: hashFiles('dist/latest.json') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: dist/latest.json
          fail_on_unmatched_files: true
          generate_release_notes: true
